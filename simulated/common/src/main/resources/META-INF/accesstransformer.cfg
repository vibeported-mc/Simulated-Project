# Contraption Diagram
#
# HangingEntity.recalculateBoundingBox is protected, and ItemFrame overrides it as protected final.
# Widening only the parent makes that override illegal -- and it fails during *decompilation*, as
# "attempting to assign weaker access privileges", long before anything is compiled against it. Any
# override in the hierarchy has to be widened with the base. Painting inherits rather than overrides,
# and LeashFenceKnotEntity descends from BlockAttachedEntity rather than HangingEntity, so neither
# is affected.
public-f net.minecraft.world.entity.decoration.HangingEntity recalculateBoundingBox()V # recalculateBoundingBox
public-f net.minecraft.world.entity.decoration.ItemFrame recalculateBoundingBox()V # recalculateBoundingBox
