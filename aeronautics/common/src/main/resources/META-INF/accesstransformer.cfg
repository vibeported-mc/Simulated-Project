# Levitite Rendertype
#
# RenderType.create(..., CompositeState) and CompositeState itself are gone: a render type is
# assembled from a RenderPipeline and a RenderSetup now. Levitite needs more than a widened
# constructor regardless -- it draws with GL_PATCHES through Veil's PatchesLayer and carries
# tessellation control and evaluation stages, both of which have to survive onto a RenderPipeline.
# PatchesLayer is still parked in Veil (mixin/DISABLED-26.2/PatchesLayer.java.disabled).
#public net.minecraft.client.renderer.RenderType create(Ljava/lang/String;Lcom/mojang/blaze3d/vertex/VertexFormat;Lcom/mojang/blaze3d/vertex/VertexFormat$Mode;IZZLnet/minecraft/client/renderer/RenderType$CompositeState;)Lnet/minecraft/client/renderer/RenderType$CompositeRenderType;

