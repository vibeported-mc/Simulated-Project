plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

evaluationDependsOn(':simulated:neoforge')

def generatedResources = project(":aeronautics:common").file("src/generated/resources")
def commonResources = project(":aeronautics:common").file("src/main/resources")

neoForge {
    version = neoforge_version

    def at = project(':aeronautics:common').file('src/main/resources/META-INF/accesstransformer.cfg')

    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    // 26.2 ships unobfuscated and has no Parchment release; the guard keeps the block for the
    // day one exists rather than deleting it.
    if (parchment_version != "none") {
        parchment {
            minecraftVersion = parchment_minecraft == "same" ? minecraft_version : parchment_minecraft
            mappingsVersion = parchment_version
        }
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "Aero NeoForge ${it.name.capitalize()} (${project.path})"
        }

        // 26.2 port: datagen is split by side, so there are two runs rather than one --
        // matching the GatherDataEvent.Client / .Server split the providers were ported onto.
        //
        // The two runs share an output directory and datagen prunes whatever the current run does
        // not produce, so running one side alone deletes the other side's files. Pass
        // -PdataOut=<dir> to write somewhere else -- which is how a run is verified without
        // rewriting the committed tree, and how the two sides are generated separately and merged.
        clientData {
            clientData()
            gameDirectory = project.file('runs/data')
            programArguments.addAll '--all',
                    '--mod', 'aeronautics',
                    '--output', (project.hasProperty('dataOut') ? file(project.property('dataOut')) : generatedResources).absolutePath,
                    '--existing', commonResources.absolutePath
        }

        serverData {
            serverData()
            gameDirectory = project.file('runs/data')
            programArguments.addAll '--all',
                    '--mod', 'aeronautics',
                    '--output', (project.hasProperty('dataOut') ? file(project.property('dataOut')) : generatedResources).absolutePath,
                    '--existing', commonResources.absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        simulated {
            sourceSet project(':simulated:neoforge').sourceSets.main
        }
    }
}

sourceSets.main.resources {
    srcDir generatedResources.absolutePath
}

// Port scaffolding: report every error, not javac's default first 100.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

// ModDevGradle 2.0.144 does not know Minecraft 26.2, so its version capability table falls back to
// requesting Java 21 for the NeoFormRuntime tasks. Gradle 9 cannot auto-provision one either: the
// foojay resolver still references JvmVendorSpec.IBM_SEMERU, which Gradle 9 removed.
tasks.withType(net.neoforged.nfrtgradle.NeoFormRuntimeTask).configureEach {
    javaExecutable.set(javaToolchains.launcherFor(java.toolchain).map { it.executablePath.asFile.absolutePath })
}

// 26.2 port: JEI has no 26.2 build.
sourceSets.main.java {
    exclude 'dev/eriksonn/aeronautics/neoforge/compat/jei/**'
}
