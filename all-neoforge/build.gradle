plugins {
    id 'net.neoforged.moddev'
}

def neoforgeProjects = rootProject.subprojects.findAll { it.path.endsWith(":neoforge") }

neoforgeProjects.each { neoforgeProject ->
    evaluationDependsOn(neoforgeProject.path)
}

neoForge {
    version = neoforge_version

    neoforgeProjects.forEach { neoforgeProject ->
        def parentName = neoforgeProject.parent.name
        def commonProject = project(":$parentName:common")
        def at = commonProject.file('src/main/resources/META-INF/accesstransformer.cfg')

        if (at.exists()) {
            accessTransformers.from(at.absolutePath)
        }
    }

    // 26.2 port: the six real modules already guard this; these two did not, and asked for
    // "parchment-same:none" -- a placeholder pair of property values, not a real artifact. There are
    // no Parchment mappings for 26.2, so gradle.properties leaves both at their "off" values.
    if (parchment_version != "none") {
        parchment {
            minecraftVersion = parchment_minecraft == "same" ? minecraft_version : parchment_minecraft
            mappingsVersion = parchment_version
        }
    }

    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }

        client {
            client()
            gameDirectory = project.file('runs/client')
        }

        // Boots straight into runs/client/saves/porttest rather than stopping at the title screen.
        // Reaching a level is the acceptance gate for most of this port, and clicking through the
        // menus by hand is not something a run can do for itself.
        clientWorld {
            client()
            gameDirectory = project.file('runs/client')
            programArgument '--quickPlaySingleplayer'
            programArgument 'porttest'
        }

        // The same client on Minecraft's Vulkan backend, in its own game directory so a Vulkan
        // run and an OpenGL one do not fight over one set of options and configs.
        //
        // --graphicsBackend alone is not enough: FML's early loading screen creates a GL context
        // on the window before Minecraft's backend loop runs, so Vulkan cannot get GLFW_NO_API
        // and PreferredGraphicsApi quietly falls back to OpenGL. The game then starts, plays and
        // looks correct while not being on Vulkan at all. disableEarlyWindowForVulkan turns that
        // screen off, and is wired as a dependency below because a run directory regenerates
        // with it on.
        clientVulkan {
            client()
            gameDirectory = project.file('runs/vulkan')
            programArguments.addAll('--graphicsBackend', 'vulkan')
        }

        // The Vulkan client, straight into the saved world rather than the title screen.
        //
        // The renderer faults worth looking at are all in a level, and several of them only show
        // while the camera is moving, so clicking through the menus by hand is the slow part of
        // every attempt to reproduce one.
        clientVulkanWorld {
            client()
            gameDirectory = project.file('runs/vulkan')
            programArguments.addAll('--graphicsBackend', 'vulkan')
            programArgument '--quickPlaySingleplayer'
            programArgument 'normal'
        }

        // The same world and the same game directory as clientVulkanWorld, on OpenGL.
        //
        // Deliberately not its own directory, unlike the pair above: comparing a renderer fault
        // between the two backends means comparing them on the same build, in the same place,
        // from the same angle, and a second world would be none of those. The two cannot run at
        // once over one directory, which is the price.
        clientOpenGlWorld {
            client()
            gameDirectory = project.file('runs/vulkan')
            programArguments.addAll('--graphicsBackend', 'opengl')
            programArgument '--quickPlaySingleplayer'
            programArgument 'normal'
        }

        clientAuth {
            client()
            gameDirectory = project.file('runs/client')
            devLogin = true
        }

        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument 'nogui'
        }
    }

    mods {
        neoforgeProjects.forEach { neoforgeProject ->
            def parentName = neoforgeProject.parent.name
            "$parentName" {
                sourceSet neoforgeProject.sourceSets.main
            }
        }
    }
}

tasks.register("runDataAll") {
    group = "mod development"
    neoforgeProjects.forEach { neoforgeProject -> 
        dependsOn(neoforgeProject.tasks.runData)
    }
}

dependencies {
    neoforgeProjects.forEach {
        def parentName = it.parent.name
        implementation(it) {
            capabilities {
                requireCapability "$group:${parentName}"
            }
        }
    }
}

// Turn off FML's early loading screen for the Vulkan run directory.
//
// It is the one setting that decides whether a "Vulkan" run is actually on Vulkan, and nothing
// reports when it is wrong: FMLConfig reads earlyWindowControl from config/fml.toml only -- there
// is no system property and no launch argument for it -- and a failed Vulkan device just falls
// through to OpenGL.
tasks.register('disableEarlyWindowForVulkan') {
    description = "Disables FML's early loading screen so the Vulkan backend can start."

    def configFile = project.file('runs/vulkan/config/fml.toml')
    outputs.upToDateWhen { configFile.isFile() && configFile.text.contains('earlyWindowControl = false') }

    doLast {
        configFile.parentFile.mkdirs()
        if (!configFile.isFile()) {
            configFile.text = 'earlyWindowControl = false' + System.lineSeparator()
        } else if (configFile.text =~ /(?m)^\s*earlyWindowControl\s*=/) {
            configFile.text = configFile.text.replaceAll(/(?m)^(\s*earlyWindowControl\s*=\s*).*\$/, '\$1false')
        } else {
            configFile.text = 'earlyWindowControl = false' + System.lineSeparator() + configFile.text
        }
    }
}

tasks.matching { it.name in ['runClientVulkan', 'runClientVulkanWorld'] }.configureEach {
    dependsOn('disableEarlyWindowForVulkan')
}
