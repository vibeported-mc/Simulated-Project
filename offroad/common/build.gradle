plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    // 26.2 port: NeoForge is the only loader these mods have, so `common` compiles against
    // the real NeoForge distribution rather than bare NeoForm -- there is no second loader
    // for the abstraction to pay for, and NeoForm publishes nothing for 26.2 anyway.
    version = neoforge_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    if (parchment_version != "none") {
        parchment {
            minecraftVersion = parchment_minecraft == "same" ? minecraft_version : parchment_minecraft
            mappingsVersion = parchment_version
        }
    }
}

dependencies {
    api(project(":simulated:common")) {
        capabilities {
            requireCapability "$group:simulated"
        }
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Port scaffolding: report every error, not javac's default first 100.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

// ModDevGradle 2.0.144 does not know Minecraft 26.2, so its version capability table falls back to
// requesting Java 21 for the NeoFormRuntime tasks. Gradle 9 cannot auto-provision one either.
tasks.withType(net.neoforged.nfrtgradle.NeoFormRuntimeTask).configureEach {
    javaExecutable.set(javaToolchains.launcherFor(java.toolchain).map { it.executablePath.asFile.absolutePath })
}
